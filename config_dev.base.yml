# =============================================================================
# 开发环境配置基类 - dev 环境默认值兜底
# 用户配置文件 (config_dev.yml) 会与本文件合并，缺失的配置项将使用本文件的值
# 修改本文件后，请确保同步更新 config.example.yml
#
# 说明：dev 环境原先没有 base 文件，且 config_dev.yml 被 gitignore 不在仓库，
# 导致每次新环境都要手写完整 config_dev.yml。本文件提供默认值兜底。
# =============================================================================

# 剧本分段拆分多 worker 配置
# 由 run_dev.py 读取，>0 时拉起 N 个独立 worker 进程，主调度器跳过此 job
script_split:
  worker_total: 0  # 0=主调度器单进程(兼容旧行为)；>0=由 N 个独立 worker 进程分片接管(id MOD N = index)
