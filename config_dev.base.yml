# =============================================================================
# 开发环境配置基类 - dev 环境默认值兜底
# 用户配置文件 (config_dev.yml) 会与本文件合并，缺失的配置项将使用本文件的值
# 修改本文件后，请确保同步更新 config.example.yml
#
# 说明：dev 环境原先没有 base 文件，且 config_dev.yml 被 gitignore 不在仓库，
# 导致每次新环境都要手写完整 config_dev.yml。本文件提供默认值兜底。
# =============================================================================

# 数据库连接池（兜底默认值，详见 config_prod.base.yaml 同名段注释）
database:
  pool:
    mincached: 2            # 启动时预热连接数
    maxcached: 20           # 空闲池上限（每进程）。复用优先，超出归还时真关闭
    maxconnections: 0       # 0=无硬上限。如需彻底封顶防端口耗尽，可设具体值（如 30）

pipeline:
  seedance_face_mask_enabled: true  # 是否启用 Seedance 2.0 / 2.0 Fast 图片和视频输入的人脸遮盖前置处理
  h3_prompt_optimize_enabled: true  # MiniMax H3 图生视频提交前按 I2VA/FL2VA 规范优化提示词
  h3_prompt_optimize_model: "deepseek-v4-flash"
  h3_prompt_optimize_vendor_id: 0

# 剧本分段拆分多 worker 配置
# 由 run_dev.py 读取，>0 时拉起 N 个独立 worker 进程，主调度器跳过此 job
script_split:
  worker_total: 0  # 0=主调度器单进程(兼容旧行为)；>0=由 N 个独立 worker 进程分片接管(id MOD N = index)
