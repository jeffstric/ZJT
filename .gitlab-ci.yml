# =============================================================================
# GitLab CI/CD 配置文件
# 自动运行单元测试
# =============================================================================
#
# 使用方式：
# 1. 将此文件推送到 GitLab 仓库
# 2. 确保 GitLab Runner 配置了 Docker executor 或 DinD (Docker-in-Docker)
# 3. 流水线将自动在 push 和 MR 时触发
#
# 查看流水线：GitLab → CI/CD → Pipelines
# =============================================================================

stages:
  - lint
  - test
  - e2e

# 同一分支已经创建 MR 后只保留 MR Pipeline，避免一次 push 重复跑两套测试。
# schedule 规则必须放最前：定时流水线同样带 CI_COMMIT_BRANCH，放后面会被分支规则拦截（有开放 MR 时甚至被整条抑制）。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# 变量配置
# 注意：Docker-in-Docker 相关变量（DOCKER_HOST/DOCKER_TLS_CERTDIR/DOCKER_DRIVER）
# 已随 socket 直连改造移除，docker job 不再使用 dind service。
variables:
  # 测试数据库配置
  DB_HOST: mysql_test
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: root_test_pass
  DB_NAME: zjt_unittest

  # 环境配置
  comfyui_env: unit
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

# =============================================================================
# 阻塞调用 lint job
# =============================================================================
lint:blocking_calls:
  stage: lint
  # 走 daocloud 加速镜像，避免直连 registry-1.docker.io 网络超时（与 unit_tests job 保持一致）
  image: m.daocloud.io/docker.io/library/python:3.10-slim
  script:
    - python scripts/lint_blocking_calls.py --allow-file scripts/lint_blocking_calls_allowlist.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:storyboard_render:
  stage: lint
  image: m.daocloud.io/docker.io/library/python:3.10-slim
  script:
    - python scripts/lint_storyboard_render.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/js/storyboard/**/*
        - scripts/lint_storyboard_render.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - web/js/storyboard/**/*
        - scripts/lint_storyboard_render.py

# =============================================================================
# 单元测试 job
# =============================================================================
unit_tests:
  stage: test

  # 直连宿主机 dockerd（jeffnas1-socket runner 已挂载 /var/run/docker.sock），
  # 不再使用 dind service。层缓存持久保留在宿主机：依赖不变跳过构建，
  # 依赖变化仅重建变化层（pip/uv wheel 走 BuildKit cache mount）。
  image: m.daocloud.io/docker.io/library/docker:24-cli

  # 无需 CI cache：镜像层缓存在宿主机 dockerd 中，源码经 bind mount 进容器，
  # 纯代码改动零构建。
  # 冷缓存首跑（全量构建+测试）可达 40~70 分钟，先保留 2h；缓存稳定后收紧到 1h
  timeout: 2 hours

  variables:
    # 共享宿主 daemon，compose 资源按 job 隔离（容器/网络/卷名自动带前缀）
    COMPOSE_PROJECT_NAME: zjt-test-${CI_JOB_ID}

  before_script:
    - docker info   # 直连 socket，无需等待 daemon（dind 时代的探测/调试代码已全部移除）
    # bind mount 路径翻译：宿主 daemon 需要宿主侧绝对路径。
    # 依赖 runner 的固定挂载 /srv/gitlab-builds:/builds，调整 builds_dir 时需同步修改。
    - export HOST_SRC_DIR="/srv/gitlab-builds${CI_PROJECT_DIR#/builds}"
    - echo "HOST_SRC_DIR=$HOST_SRC_DIR"

  script:
    # 进入 docker 目录
    - cd docker

    # 环境镜像指纹：requirements.txt 或 Dockerfile 变化才重建
    - DEPS_HASH=$(cat ../requirements.txt Dockerfile | sha256sum | cut -c1-16)
    - export TEST_IMAGE_TAG=$DEPS_HASH
    - 'echo "环境镜像标签: zjt_test_image:$TEST_IMAGE_TAG"'

    # 强制重建逃生通道：手动流水线带 FORCE_REBUILD=1 时丢弃指纹镜像
    - |
      if [ "$FORCE_REBUILD" = "1" ]; then
        echo "FORCE_REBUILD=1，删除指纹镜像强制重建"
        docker image rm "zjt_test_image:$TEST_IMAGE_TAG" 2>/dev/null || true
      fi

    # 命中即跳过构建；未命中时构建也只重做变化层
    - |
      if docker image inspect "zjt_test_image:$TEST_IMAGE_TAG" > /dev/null 2>&1; then
        echo "镜像缓存命中，跳过构建"
      else
        echo "未命中，执行构建"
        docker compose -f docker-compose-test.yml build test
      fi

    # 冒烟验证：镜像可用且依赖自洽（--entrypoint 覆盖 docker-entrypoint.sh，
    # 否则 "pip check" 只是入口脚本的参数）
    - docker run --rm --entrypoint pip "zjt_test_image:$TEST_IMAGE_TAG" check

    # 启动测试环境（MySQL + 测试容器）。注意不带 --build
    # 失败时输出 MySQL 日志，便于定位 unhealthy 根因
    - |
      if ! docker compose -f docker-compose-test.yml up -d; then
        echo "===== compose up 失败，输出诊断信息 ====="
        docker compose -f docker-compose-test.yml ps -a || true
        docker compose -f docker-compose-test.yml logs mysql_test 2>&1 | tail -100 || true
        exit 1
      fi

    # 等 MySQL 就绪（healthcheck 兜底；socket 模式冷启动预期 <60s）
    - |
      for i in $(seq 1 90); do
        docker exec "$(docker compose -f docker-compose-test.yml ps -q mysql_test)" \
          mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot_test_pass >/dev/null 2>&1 && break
        echo "等待 MySQL 启动... ($i)"
        sleep 2
      done

    # 测试容器句柄（container_name 已删，按 project + service 取 ID）
    - TEST_CID=$(docker compose -f docker-compose-test.yml ps -q test)
    - echo "测试容器: $TEST_CID"

    # 等待测试完成：1s 轮询（原 10s 轮询平均多等 5s）。
    # run_unit_tests.py 默认进程隔离执行（每测试模块一个子进程），
    # 启动开销使整轮耗时增加约 3~8 分钟，等待上限相应放宽到 1800s
    - |
      timeout=1800; elapsed=0
      while [ $elapsed -lt $timeout ]; do
        status=$(docker inspect -f '{{.State.Status}}' "$TEST_CID" 2>/dev/null || echo "not_found")
        [ "$status" = "exited" ] && break
        sleep 1; elapsed=$((elapsed + 1))
      done

    # 获取容器退出码并展示日志
    - exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$TEST_CID" || echo "1")
    - docker logs --tail 500 "$TEST_CID" || true
    - |
      if docker cp "$TEST_CID:/app/test-results.xml" ../test-results.xml 2>/dev/null; then
        echo "测试结果已保存"
      else
        echo "注意：无法获取 test-results.xml，查看上方日志了解测试情况"
      fi

    # 停止测试环境
    - docker compose -f docker-compose-test.yml down -v || true

    # 镜像治理：指纹 tag 只保留最近 3 个，防磁盘膨胀
    # （docker rmi 对使用中的镜像自动拒绝，不影响并发中的其他 job）
    - |
      docker images zjt_test_image --format '{{.Tag}}' \
        | tail -n +4 | xargs -r -n1 sh -c 'docker image rm "zjt_test_image:$0" 2>/dev/null' || true

    # 根据退出码决定 CI 结果
    - |
      echo "测试容器退出码: $exit_code"
      if [ "$exit_code" != "0" ]; then
        echo "测试失败！退出码: $exit_code"
        exit 1
      fi

  # 测试 artifacts
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    expire_in: 7 days

  # socket 直连专用 runner（jeffnas1-socket，挂载 /var/run/docker.sock）
  tags: [docker-socket]

  # 规则：推送和 MR 时触发
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# 分支级 E2E 冒烟测试
# socket 直连宿主 daemon：app/e2e 镜像构建命中宿主机层缓存（依赖未变时仅重做
# COPY 代码层），Playwright 基础镜像与 mysql:8.0 驻留宿主机，不再每 pipeline 重拉。
# 每条 Pipeline 使用独立的 COMPOSE_PROJECT_NAME，容器、网络和卷互不共享。
# =============================================================================
e2e_smoke:
  stage: e2e
  image: m.daocloud.io/docker.io/library/docker:24-cli

  variables:
    COMPOSE_PROJECT_NAME: e2e-${CI_PIPELINE_ID}-${CI_JOB_ID}
    E2E_COMPOSE_FILE: docker/docker-compose-e2e.yml
    E2E_RESULT_CONTAINER: e2e-result-${CI_JOB_ID}

  before_script:
    - docker info   # 直连 socket，无需等待 daemon
    - docker compose version
    # bind mount 路径翻译（与 unit_tests 同理，依赖 /srv/gitlab-builds:/builds 固定挂载）
    - export HOST_SRC_DIR="/srv/gitlab-builds${CI_PROJECT_DIR#/builds}"
    - echo "HOST_SRC_DIR=$HOST_SRC_DIR"

  script:
    - docker compose -f "$E2E_COMPOSE_FILE" build app e2e
    - docker compose -f "$E2E_COMPOSE_FILE" up -d mysql
    - docker compose -f "$E2E_COMPOSE_FILE" run --rm prepare
    - docker compose -f "$E2E_COMPOSE_FILE" up -d app
    - docker compose -f "$E2E_COMPOSE_FILE" run --name "$E2E_RESULT_CONTAINER" e2e

  after_script:
    - mkdir -p e2e-results
    - docker cp "$E2E_RESULT_CONTAINER:/results/." e2e-results/ || true
    - docker compose -f "$E2E_COMPOSE_FILE" logs --no-color mysql app > e2e-results/services.log 2>&1 || true
    - docker rm -f "$E2E_RESULT_CONTAINER" > /dev/null 2>&1 || true
    - docker compose -f "$E2E_COMPOSE_FILE" down -v --remove-orphans || true
    # 镜像治理：per-pipeline tag 只保留最近 3 条 pipeline 的镜像
    # （docker rmi 对使用中的镜像自动拒绝，不影响并发中的其他 job）
    - |
      for repo in zjt-e2e-app zjt-e2e-runner; do
        docker images "$repo" --format '{{.Tag}}' \
          | tail -n +4 | xargs -r -n1 sh -c "docker image rm $repo:\$0 2>/dev/null" || true
      done

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e-results/
    reports:
      junit: e2e-results/junit.xml

  interruptible: true
  # 切换初期宿主机缓存尚冷时首次构建仍可能较慢，保留 90m；稳定后可收紧到 45m
  timeout: 90m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

  # socket 直连专用 runner（jeffnas1-socket，挂载 /var/run/docker.sock）
  tags: [docker-socket]

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH

# =============================================================================
# 前端 JS 单元测试 job（Vitest）
# =============================================================================
frontend_tests:
  stage: test

  # 不依赖 DinD，直接在 node 镜像里跑，比后端 unit_tests 轻量很多
  image: m.daocloud.io/docker.io/library/node:20-slim

  # npm 缓存，加速后续构建
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
    policy: pull-push

  before_script:
    - npm config set cache .npm
    - npm ci --no-audit --no-fund

  script:
    - npm run test:ci

  artifacts:
    when: always
    paths:
      - frontend-test-results.xml
    reports:
      junit: frontend-test-results.xml
    expire_in: 7 days

  tags:
    - docker

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
