# =============================================================================
# GitLab CI/CD 配置文件
# 自动运行单元测试
# =============================================================================
#
# 使用方式：
# 1. 将此文件推送到 GitLab 仓库
# 2. 确保 GitLab Runner 配置了 Docker executor 或 DinD (Docker-in-Docker)
# 3. 流水线将自动在 push 和 MR 时触发
#
# 查看流水线：GitLab → CI/CD → Pipelines
# =============================================================================

stages:
  - lint
  - test

# 变量配置
variables:
  # Docker 配置 - DinD
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

  # 测试数据库配置
  DB_HOST: mysql_test
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: root_test_pass
  DB_NAME: zjt_unittest

  # 环境配置
  comfyui_env: unit
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

# =============================================================================
# 阻塞调用 lint job
# =============================================================================
lint:blocking_calls:
  stage: lint
  # 走 daocloud 加速镜像，避免直连 registry-1.docker.io 网络超时（与 unit_tests job 保持一致）
  image: m.daocloud.io/docker.io/library/python:3.10-slim
  script:
    - python scripts/lint_blocking_calls.py --allow-file scripts/lint_blocking_calls_allowlist.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:storyboard_render:
  stage: lint
  image: m.daocloud.io/docker.io/library/python:3.10-slim
  script:
    - python scripts/lint_storyboard_render.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/js/storyboard/**/*
        - scripts/lint_storyboard_render.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - web/js/storyboard/**/*
        - scripts/lint_storyboard_render.py

# =============================================================================
# 单元测试 job
# =============================================================================
unit_tests:
  stage: test

  # 使用 Docker-in-Docker (DinD) 来运行 docker-compose
  image: m.daocloud.io/docker.io/library/docker:24-cli

  services:
    - name: m.daocloud.io/docker.io/library/docker:24-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
      command: ["--registry-mirror=https://docker.1ms.run", "--registry-mirror=https://docker.mirrors.ustc.edu.cn"]


  # 缓存配置（加速后续构建）
  # 注意：DinD 每个 job 都是全新守护进程，镜像层缓存无法保留（实测 docker
  # save/load 后 builder 缓存元数据丢失，无法增量重建）。因此改为把构建出的
  # 环境镜像整体 docker save 到 CI cache，下次 job docker load 后按
  # requirements.txt+Dockerfile 指纹复用镜像、跳过构建，源码经 ..:/app
  # 挂载进容器运行——纯代码改动零构建（pip 全量下载是 1h 超时的主因）。
  # key 固定为全局共享，让所有分支都能复用同一份镜像缓存。
  cache:
    key: zjt-unit-test-shared
    paths:
      - cache/pip
      - .cache/pip
      - docker-image-cache/

  # job 超时兜底：依赖变化触发全量重建时可能接近 1h，放宽到 2h 避免误杀
  timeout: 2 hours

  before_script:
    # 使用国内 Alpine 镜像源加速
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories

    # 安装必要工具
    - apk add --no-cache python3 py3-pip mysql-client netcat-openbsd bind-tools

    # ===== 深度调试 =====
    - echo "===== 环境变量 ====="
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - echo "DOCKER_TLS_CERTDIR=$DOCKER_TLS_CERTDIR"
    
    - echo "===== DNS 解析测试 ====="
    - cat /etc/hosts | grep -i docker || echo "No docker in /etc/hosts"
    - getent hosts docker || echo "Cannot resolve 'docker' via getent"
    - nslookup docker 2>/dev/null || echo "Cannot resolve 'docker' via nslookup"
    
    - echo "===== 网络连通性测试 ====="
    - nc -zv docker 2375 2>&1 || echo "Port 2375 NOT reachable on 'docker'"
    - nc -zv docker 2376 2>&1 || echo "Port 2376 NOT reachable on 'docker'"
    - nc -zv localhost 2375 2>&1 || echo "Port 2375 NOT reachable on localhost"
    
    - echo "===== 尝试多种 DOCKER_HOST ====="
    # ===== 深度调试结束 =====

    # 等待 Docker daemon 就绪（尝试多种连接方式）
    - |
      echo "Waiting for Docker daemon..."
      max_attempts=30
      for i in $(seq 1 $max_attempts); do
        # 尝试默认 DOCKER_HOST
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon is ready via $DOCKER_HOST!"
          break
        fi
        # 尝试 localhost
        if DOCKER_HOST=tcp://localhost:2375 docker info > /dev/null 2>&1; then
          echo "Docker daemon is ready via localhost:2375!"
          export DOCKER_HOST=tcp://localhost:2375
          break
        fi
        # 尝试 127.0.0.1
        if DOCKER_HOST=tcp://127.0.0.1:2375 docker info > /dev/null 2>&1; then
          echo "Docker daemon is ready via 127.0.0.1:2375!"
          export DOCKER_HOST=tcp://127.0.0.1:2375
          break
        fi
        if [ $i -eq $max_attempts ]; then
          echo "ERROR: Docker daemon failed to start after $max_attempts attempts"
          echo "===== 最终诊断 ====="
          echo "检查所有容器进程:"
          ps aux
          echo "检查网络接口:"
          ip addr 2>/dev/null || ifconfig 2>/dev/null || echo "No network tools"
          exit 1
        fi
        echo "Attempt $i/$max_attempts - waiting..."
        sleep 3
      done

    # 验证 Docker 是否可用
    - docker --version
    - docker-compose --version

    # 加载上一次流水线保存的环境镜像（含基础镜像与 MySQL 镜像），首次运行为空则跳过
    - |
      if [ -f docker-image-cache/zjt_test_image.tar.gz ]; then
        echo "加载环境镜像缓存..."
        docker load -i docker-image-cache/zjt_test_image.tar.gz || echo "镜像缓存加载失败，按全量构建继续"
      else
        echo "无镜像缓存，本次为全量构建"
      fi

  script:
    # 进入 docker 目录
    - cd docker

    # 环境镜像指纹：requirements.txt 或 Dockerfile 变化才需要重建。
    # 源码通过 ..:/app 挂载进容器运行，纯代码改动复用缓存镜像即可
    - DEPS_HASH=$(cat ../requirements.txt Dockerfile | sha256sum | cut -c1-16)
    - export TEST_IMAGE_TAG=$DEPS_HASH
    - 'echo "环境镜像标签: zjt_test_image:$TEST_IMAGE_TAG"'

    # 缓存已加载且依赖未变则跳过构建（这是防 1h 超时的核心：避免每次 pip 全量下载）
    - |
      export REBUILT=0
      if docker image inspect "zjt_test_image:$TEST_IMAGE_TAG" > /dev/null 2>&1; then
        echo "依赖未变化且镜像缓存已加载，跳过构建"
      else
        echo "依赖变化或无缓存，执行全量构建（首次约 40-60 分钟）"
        docker compose -f docker-compose-test.yml build test
        export REBUILT=1
      fi

    # 启动测试环境（MySQL + 测试容器）。注意不带 --build
    - docker compose -f docker-compose-test.yml up -d

    # 仅在发生过重建时更新镜像缓存。
    # 必须连同基础镜像一起保存：否则下次 FROM 重新拉取，tag 上游重建后 ID 变化会导致缓存失配
    - |
      if [ "$REBUILT" = "1" ]; then
        mkdir -p ../docker-image-cache
        BASE_IMAGE=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')
        docker save "zjt_test_image:$TEST_IMAGE_TAG" "$BASE_IMAGE" m.daocloud.io/docker.io/library/mysql:8.0 | gzip > ../docker-image-cache/zjt_test_image.tar.gz || echo "镜像缓存保存失败，忽略"
      else
        echo "镜像未重建，缓存保持不变"
      fi

    # 等待 MySQL 就绪
    - |
      for i in {1..30}; do
        docker exec zjt_mysql_test mysqladmin ping -h localhost -u root -proot_test_pass && break
        echo "等待 MySQL 启动..."
        sleep 2
      done

    # 等待测试容器完成并获取日志
    # run_unit_tests.py 默认进程隔离执行（每测试模块一个子进程），
    # 启动开销使整轮耗时增加约 3~8 分钟，等待上限相应放宽到 1800s
    - |
      echo "等待测试执行完成..."
      timeout=1800
      elapsed=0
      while [ $elapsed -lt $timeout ]; do
        status=$(docker inspect -f '{{.State.Status}}' zjt_test 2>/dev/null || echo "not_found")
        if [ "$status" == "exited" ]; then
          break
        fi
        echo "测试进行中... (${elapsed}s)"
        sleep 10
        elapsed=$((elapsed + 10))
      done

    # 获取容器退出码
    - exit_code=$(docker inspect -f '{{.State.ExitCode}}' zjt_test 2>/dev/null || echo "1")

    # 显示测试日志
    - docker logs zjt_test || true

    # 获取测试结果
    - |
      if docker cp zjt_test:/app/test-results.xml ../test-results.xml 2>/dev/null; then
        echo "测试结果已保存"
      else
        echo "注意：无法获取 test-results.xml，查看上方日志了解测试情况"
      fi

    # 停止测试环境
    - docker-compose -f docker-compose-test.yml down -v || true

    # 根据退出码决定 CI 结果
    - |
      echo "测试容器退出码: $exit_code"
      if [ "$exit_code" != "0" ]; then
        echo "测试失败！退出码: $exit_code"
        exit 1
      fi

  # 测试 artifacts
  artifacts:
    when: always
    paths:
      - test-results.xml
      - docker/*.log
      - docker/logs/
    reports:
      junit: test-results.xml
    expire_in: 7 days

  # 标签（根据实际 Runner 配置调整）
  tags:
    - docker

  # 规则：推送和 MR 时触发
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# 前端 JS 单元测试 job（Vitest）
# =============================================================================
frontend_tests:
  stage: test

  # 不依赖 DinD，直接在 node 镜像里跑，比后端 unit_tests 轻量很多
  image: m.daocloud.io/docker.io/library/node:20-slim

  # npm 缓存，加速后续构建
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
    policy: pull-push

  before_script:
    - npm config set cache .npm
    - npm ci --no-audit --no-fund

  script:
    - npm run test:ci

  artifacts:
    when: always
    paths:
      - frontend-test-results.xml
    reports:
      junit: frontend-test-results.xml
    expire_in: 7 days

  tags:
    - docker

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

