<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title data-i18n="page_title">视频工作流列表</title>
  <link rel="icon" href="/files/logo.ico" type="image/vnd.microsoft.icon"/>
  <!-- i18n 支持 -->
  <script src="/i18n/i18n-core.js?v=__VERSION__"></script>
  <script src="/i18n/i18n-dom.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/i18n/i18n-switcher.css?v=__VERSION__" />
  <script src="/i18n/i18n-switcher.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/video_workflow_list.css">
</head>
<body>
  <!-- 语言切换器 -->
  <div class="i18n-switcher-container" id="i18nSwitcher"></div>

  <div class="container">
    <div class="header">
      <div class="header-left">
        <a href="/" class="brand">
          <img src="/files/logo.svg" alt="Logo">
          <span class="brand-title" data-i18n="brand_title">智剧通 AI短剧制作平台</span>
        </a>
        <h1 class="page-title" data-i18n="page_title">视频工作流</h1>
        <nav class="breadcrumb">
          <a href="/" data-i18n="breadcrumb_home">首页</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current" data-i18n="breadcrumb_current">视频工作流</span>
        </nav>
      </div>
      <button class="btn" onclick="openCreateModal()" data-i18n="create_workflow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        新建工作流
      </button>
    </div>

    <button class="agent-btn" id="agentBtn" onclick="handleAgentClick()">
      <div class="agent-btn-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7L12 12L22 7L12 2Z"></path>
          <path d="M2 17L12 22L22 17"></path>
          <path d="M2 12L12 17L22 12"></path>
        </svg>
        <span data-i18n="agent_title">短剧智能体</span>
      </div>
      <div class="agent-btn-desc" data-i18n="agent_desc">AI智能体生成剧本，人物，场景，道具</div>
    </button>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" data-i18n="search_placeholder:placeholder" placeholder="搜索工作流名称..." onkeyup="handleSearch(event)">
        <select class="filter-select" id="statusFilter" onchange="loadWorkflows()">
          <option value="" data-i18n="status_all">全部状态</option>
          <option value="1" data-i18n="status_enabled">已启用</option>
          <option value="0" data-i18n="status_disabled">已禁用</option>
          <option value="2" data-i18n="status_draft">草稿</option>
        </select>
      </div>
    </div>

    <div id="workflowContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div data-i18n="loading">加载中...</div>
      </div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <button class="pagination-btn" id="prevBtn" onclick="prevPage()" data-i18n="previous_page">上一页</button>
      <span class="pagination-info" id="pageInfo"></span>
      <button class="pagination-btn" id="nextBtn" onclick="nextPage()" data-i18n="next_page">下一页</button>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle" data-i18n="create_modal_title">新建工作流</h2>
      <form id="workflowForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="workflowId">
        <div class="modal-two-column">
          <div class="modal-left-column">
            <div class="form-group">
              <label class="form-label" data-i18n="workflow_name_label">工作流名称 *</label>
              <input type="text" class="form-input" id="workflowName" required>
            </div>
            <div class="form-group">
              <button type="button" class="btn btn-secondary btn-sm" id="toggleDescBtn" onclick="toggleDescSection()" style="width: 100%; justify-content: center;" data-i18n="expand_desc">展开填写描述</button>
              <div id="descSection" style="display: none; margin-top: 12px;">
                <label class="form-label" data-i18n="workflow_desc_label">描述</label>
                <textarea class="form-input form-textarea" id="workflowDesc"></textarea>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="world_label">世界</label>
              <div style="font-size: 12px; color: var(--muted); margin-bottom: 6px;" data-i18n="world_desc_hint">世界是一个包裹角色、场景、道具还有剧本的盒子</div>
              <div style="display: flex; gap: 8px;">
                <select class="form-input" id="workflowWorld" style="flex: 1;">
                  <option value="" data-i18n="select_world_placeholder">选择世界（可选）</option>
                </select>
                <button type="button" class="btn btn-secondary" onclick="openWorldModal()" style="white-space: nowrap;" data-i18n="create_world_btn">新建世界</button>
              </div>
            </div>
            <div class="form-group" id="styleFieldGroup">
              <label class="form-label">
                <span data-i18n="style_label">画风</span>
                <a href="/image-style-guide" target="_blank" style="margin-left: 8px; font-size: 12px; color: #3b82f6; text-decoration: none; font-weight: normal; border-bottom: 1px solid transparent; transition: border-color 0.2s;" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='transparent'" data-i18n="style_guide_link style_guide_link:title">查看画风说明</a>
                <span style="margin-left: 8px; font-size: 12px; color: #6b7280; font-weight: normal;" data-i18n="style_guide_desc">不知道如何描述画风？可以在即梦寻找画风。查看：<a href="https://bq3mlz1jiae.feishu.cn/wiki/LBw5w7zZaiuQhuk4sT7c42zcn0e#share-NKbIdQfDdouM8xx3LxIcZrPHn7c" target="_blank" style="color: #3b82f6; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s;" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='transparent'">文档</a>。</span>
              </label>
              <input type="text" class="form-input" id="workflowStyle" list="styleOptions" data-i18n="style_placeholder:placeholder" placeholder="选择或输入画风">
              <datalist id="styleOptions">
                <option value="漫画风格">
                <option value="写实风格">
                <option value="日漫:新海诚风">
                <option value="美漫:漫威风">
                <option value="皮克斯风">
                <option value="日漫:宫崎骏风">
                <option value="迪士尼风格">
                <option value="国漫:3D动画风">
                <option value="日漫:今敏风">
                <option value="国漫:2D手绘风">
                <option value="日漫:细田守风">
                <option value="赛博朋克风">
                <option value="美漫:DC风">
              </datalist>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="status_label">状态</label>
              <select class="form-input" id="workflowStatus">
                <option value="1" data-i18n="status_enabled_option">启用</option>
                <option value="2" data-i18n="status_draft_option">草稿</option>
                <option value="0" data-i18n="status_disabled_option">禁用</option>
              </select>
            </div>
          </div>
          <div class="modal-right-column">
            <div class="form-group">
              <label class="form-label" data-i18n="workflow_ratio_label">工作流比例 *</label>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <!-- 16:9 横屏 -->
                <label class="ratio-option">
                  <input type="radio" name="workflowRatio" value="16:9">
                  <div class="ratio-icon ratio-icon-landscape"></div>
                  <div class="ratio-text">
                    <span class="ratio-value">16:9</span>
                    <span class="ratio-label" data-i18n="ratio_landscape">横屏</span>
                  </div>
                </label>
                <!-- 9:16 竖屏 -->
                <label class="ratio-option">
                  <input type="radio" name="workflowRatio" value="9:16">
                  <div class="ratio-icon ratio-icon-portrait"></div>
                  <div class="ratio-text">
                    <span class="ratio-value">9:16</span>
                    <span class="ratio-label" data-i18n="ratio_portrait">竖屏</span>
                  </div>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="cancel_btn">取消</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="handleSubmit(event)" data-i18n="create_only_btn">仅创建工作流</button>
          <button type="button" class="btn" onclick="handleSubmitAndGoScript(event)" data-i18n="create_and_script_btn">创建并生成剧本</button>
        </div>
      </form>
    </div>
  </div>

  <!-- World Creation Modal -->
  <div class="modal-overlay" id="worldModal">
    <div class="modal">
      <h2 class="modal-title" data-i18n="create_world_modal_title">新建世界</h2>
      <form id="worldForm" onsubmit="handleWorldSubmit(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="world_name_label">世界名称 *</label>
          <input type="text" class="form-input" id="worldName" required>
        </div>
        <div class="form-group">
          <button type="button" class="btn btn-secondary btn-sm" id="toggleWorldDescBtn" onclick="toggleWorldDescSection()" style="width: 100%; justify-content: center;" data-i18n="expand_desc">展开填写描述</button>
          <div id="worldDescSection" style="display: none; margin-top: 12px;">
            <label class="form-label" data-i18n="world_desc_label">描述</label>
            <textarea class="form-input form-textarea" id="worldDesc"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeWorldModal()" data-i18n="cancel_btn">取消</button>
          <button type="submit" class="btn" data-i18n="create_btn">创建</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h2 class="modal-title" data-i18n="delete_confirm_title">确认删除</h2>
      <p style="color: var(--muted); margin-bottom: 24px;" data-i18n="delete_confirm_desc">确定要删除这个工作流吗？此操作不可撤销。</p>
      <input type="hidden" id="deleteWorkflowId">
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()" data-i18n="cancel_btn">取消</button>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()" data-i18n="delete_btn">删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 意见反馈按钮 -->
  <button class="feedback-btn" onclick="document.getElementById('feedbackModal').classList.add('active')" data-i18n="feedback_btn">
    💬 意见反馈
  </button>

  <!-- 意见反馈弹窗 -->
  <div class="modal-overlay" id="feedbackModal">
    <div class="modal">
      <h2 class="modal-title" data-i18n="feedback_modal_title">意见反馈</h2>
      <div class="feedback-modal-content">
        <p style="color: var(--muted); margin-bottom: 16px;" data-i18n="feedback_scan_tip">扫描二维码添加微信，提交您的宝贵意见</p>
        <img src="/files/二维码.jpg" class="feedback-qr-code" data-i18n="feedback_qr_code_alt:alt">
        <p class="feedback-tip" data-i18n="feedback_message">我们会认真听取每一条反馈，持续改进产品体验</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="document.getElementById('feedbackModal').classList.remove('active')" data-i18n="feedback_close_btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/state.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/video_workflow_list.js"></script>
</body>
</html>
