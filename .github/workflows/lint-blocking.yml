name: Lint Blocking Calls

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run blocking call lint
        run: python scripts/lint_blocking_calls.py --allow-file scripts/lint_blocking_calls_allowlist.txt
      - name: Run alembic migration lint (no_ naming + single head)
        run: python scripts/lint_migration_names.py
