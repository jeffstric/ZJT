email:
  enabled: true                        # 是否启用邮箱注册/登录（开关）
  active_driver: "api"  # 可选值: "smtp", "api"
  agents:
    # SMTP 代理：直接通过SMTP发送邮件
    default:
      driver: "smtp"
      smtp_host: "smtp.gmail.com"      # SMTP 服务器地址
      smtp_port: 587                    # SMTP 端口（TLS: 587, SSL: 465）
      smtp_user: "your@email.com"       # SMTP 登录账号
      smtp_password: "app_password"     # SMTP 密码 / 应用专用密码
      smtp_from: "your@email.com"       # 发件人地址
      smtp_from_name: "智剧通"          # 发件人显示名称
      use_tls: true                     # 是否使用 TLS
    # API 代理示例：通过HTTP API发送邮件（无需配置SMTP）
    api_agent:
      driver: "api"
      api_url: "https://ailive.perseids.cn:11443/api/v1/live/send_email_verify_code"  # 邮件API接口地址
      method: "POST"  # 请求方法，默认POST
      verify_ssl: true  # 是否验证SSL证书（使用http协议时设为false）


# 自动升级配置
# 支持通过 git 在启动时检查并更新代码
upgrade:
  enabled: true              # 是否启用启动时检查更新
  repo_urls:                 # Git 仓库地址（多源，按顺序尝试）
    - "https://gitee.com/jeffstric/ZJT.git"       # 优先 Gitee（国内快）
    - "https://github.com/jeffstric/ZJT.git"      # 备用 GitHub
  branch: "main"             # 跟踪分支
  timeout_seconds: 30        # git fetch/pull 超时（秒）

# ===== 数据库连接池（8·1 端口耗尽事故修复，详见 docs/backend/incidents/2026-08-01-db-port-exhaustion.md）=====
# 容量预算（MySQL 侧）= (1 scheduler + W gunicorn worker + max_workers sync_task 子进程 + N script_split worker) × maxcached
# ⚠️ 必须计入 sync_task.max_workers 个 ProcessPool 子进程（每进程独立建池）！
# 需确认 MySQL max_connections ≥ 该值 × 1.5 + 其他客户端余量。8·4 Too many connections 事故
# 正是漏算 sync_task 进程池所致。详见 docs/backend/database_connection_pool.md
# 注意：本段与用户文件 config_prod.yml 的 database:（含 host/password）深度合并，pool 子段由 base 兜底。
database:
  pool:
    mincached: 2            # 启动时预热连接数
    maxcached: 10           # 空闲池上限（每进程）。复用优先，超出归还时真关闭
    maxconnections: 0       # 0=无硬上限。如需彻底封顶防端口耗尽，可设具体值（如 30），届时池满会阻塞等待复用

# 剧本分段拆分多 worker 配置
# 由 run_prod.py 读取，>0 时拉起 N 个独立 worker 进程，主调度器跳过此 job
script_split:
  worker_total: 0  # 0=主调度器单进程(兼容旧行为)；>0=由 N 个独立 worker 进程分片接管(id MOD N = index)
